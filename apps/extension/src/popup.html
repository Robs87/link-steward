<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Link Steward</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="popup">
      <header>
        <h1>Link Steward</h1>
        <button id="refreshFolders" class="icon-button" title="刷新文件夹" type="button">↻</button>
      </header>
      <label>
        保存到文件夹
        <select id="folderSelect">
          <option value="">Link Steward/Inbox</option>
        </select>
      </label>
      <button id="saveCurrent">保存当前标签页</button>
      <p id="status"></p>
      <section class="search-panel">
        <label>
          搜索书签
          <input id="searchInput" type="search" placeholder="标题、URL、域名、标签" />
        </label>
        <button id="searchButton" class="secondary" type="button">搜索</button>
        <ul id="results"></ul>
      </section>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
